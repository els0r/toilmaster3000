# Example hook set for toilmaster3000 — edit this for your setup.
#
# Hooks are opt-in: without a .config/hooks.yaml, tm3k runs no hooks at all
# (ADR 0021/0023). Screens gate the pre-approve moment — every enabled Screen
# must answer proceed before an Approve-Rule match is auto-approved; any hold
# diverts the PR to the Needs-Human-Review queue. A Screen is defense-in-depth
# against the malicious-chore gap: it raises an attack's cost, it does NOT
# guarantee safety.
#
# Fields: Harness selects the adapter ("claude" is the only one in MVP);
# Model is optional and passed through to the harness CLI; exactly one of
# Prompt (inline instructions) or PromptFile (a path read at run time,
# relative to the working directory) must be set; Timeout bounds one run
# (absent means 10m). Leave Id out of new entries — a stable one is generated
# and written back into this file at boot.
#
# Running a Screen shells out with your existing authentication: it fetches
# each screened PR's diff via `gh pr diff` and runs the claude CLI headlessly.
# Configuring the hook is the consent for those per-PR calls.
#
# This file ships as .config/hooks.yaml next to the binary if you opt in;
# copy the referenced prompt file to .config/security-screen-prompt.md too.
Screens:
    - Name: security screen
      Harness: claude
      PromptFile: .config/security-screen-prompt.md
      Timeout: 10m
      Enabled: true

# Notifiers announce completed facts at post-points and can never block or
# divert the engine: queue_entered (rules routed a PR to Needs-Human-Review —
# the review-assist's home), screen_held (a Screen's hold diverted it; kept
# separate so a just-screened PR never auto-receives a second AI pass), and
# post_approve (an approval succeeded). Each Notifier fires once per PR EVER
# (persisted fired-ledger, at-most-once): a failed notification is a logged
# miss, never a double-post. Several Notifiers may share one point (e.g. one
# review-assist per language) — each keeps its own once-per-PR entry.
#
# The review-assist below runs the claude CLI WITH the authority to use your
# gh auth: the agent fetches the PR's diff and posts its own review comment
# (or requests changes) as YOUR identity. Its ceiling — never approve, never
# merge — is prompt-enforced, not code-enforced. It ships DISABLED: review
# the referenced prompt before enabling, then copy it to
# .config/go-review-prompt.md and flip Enabled to true.
Notifiers:
    - Name: go review assist
      Harness: claude
      PromptFile: .config/go-review-prompt.md
      Point: queue_entered
      Timeout: 10m
      Enabled: false
