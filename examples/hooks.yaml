# Example hook set for toilmaster3000 — edit this for your setup.
#
# Hooks are opt-in: without a .config/hooks.yaml, tm3k runs no hooks at all
# (ADR 0021/0023). Screens gate the pre-approve moment — every enabled Screen
# must answer proceed before an Approve-Rule match is auto-approved; any hold
# diverts the PR to the Needs-Human-Review queue. A Screen is defense-in-depth
# against the malicious-chore gap: it raises an attack's cost, it does NOT
# guarantee safety.
#
# Fields: Harness selects the adapter ("claude" or "copilot" — ADR 0024);
# Model is optional and passed through to the harness CLI; exactly one of
# Prompt (inline instructions) or PromptFile (a path read at run time,
# relative to the working directory) must be set; Timeout bounds one run
# (absent means 10m). Leave Id out of new entries — a stable one is generated
# and written back into this file at boot.
#
# Running a Screen shells out with your existing authentication: it fetches
# each screened PR's diff via `gh pr diff` and runs the harness CLI headlessly
# (the copilot harness needs `copilot login` done once on this machine).
# Configuring the hook is the consent for those per-PR calls.
#
# This file ships as .config/hooks.yaml next to the binary if you opt in;
# copy the referenced prompt file to .config/security-screen-prompt.md too.
Screens:
    - Name: security screen
      Harness: claude
      PromptFile: .config/security-screen-prompt.md
      Timeout: 10m
      Enabled: true

# Notifiers announce completed facts at post-points and can never block or
# divert the engine: queue_entered (rules routed a PR to Needs-Human-Review —
# the review-assist's home), screen_held (a Screen's hold diverted it; kept
# separate so a just-screened PR never auto-receives a second AI pass), and
# post_approve (an approval succeeded). Each Notifier fires once per PR EVER
# (persisted fired-ledger, at-most-once): a failed notification is a logged
# miss, never a double-post. Several Notifiers may share one point (e.g. one
# review-assist per language) — each keeps its own once-per-PR entry.
#
# Paths optionally SCOPES a Notifier: it fires only on PRs touching a matching
# changed file, so a language reviewer stays off the PRs it has nothing to say
# about. Patterns are gitignore-style — one containing no "/" matches at any
# depth ("*.go" covers main.go and internal/hook/hook.go alike), one containing
# "/" keeps its directory scoping ("services/api/**"). Absent Paths fires on
# every PR, which is exactly the cross-cutting reviewer that owns the seams
# between languages. Scope is checked BEFORE the fire is spent, so a Notifier
# that declines keeps its once-per-PR run for the day the PR grows into scope.
# There is no Paths on Screens: a Screen must judge every PR it is configured
# for (ADR 0026).
#
# The two review-assists below run the harness CLI WITH the authority to use
# your gh auth: the agent fetches the PR's diff and posts its own review comment
# (or requests changes) as YOUR identity. Their ceiling — never approve, never
# merge — is prompt-enforced, not code-enforced. They ship DISABLED: review the
# referenced prompt before enabling, then copy it to .config/ and flip Enabled
# to true. Two siblings on one point is the whole polyglot mechanism — a Go+bash
# PR gets one review per language, each written by a prompt that knows one
# domain, and each failing independently of the other.
#
# WorkDir (Notifiers only) runs the harness process in that directory, which is
# how the CLI finds the skills under it — .github/skills, .agents/skills,
# .claude/skills. It must be an ABSOLUTE path; nothing is expanded, so no $VAR
# and no ~. Read it as a GRANT: the run gets read access to that directory's
# whole subtree, and reads outside it are denied by the CLI. tm3k never widens
# that boundary, so choose the directory as carefully as you would choose what
# to hand an agent that is also holding your gh auth while reading a stranger's
# PR.
#
# Point it at a purpose-built, skills-only checkout — never a working clone. A
# working clone carries untracked files that are untracked for a reason, and it
# sits on whatever branch you last left it. Make one like this:
#
#     git worktree add --detach <dir> <default-branch>
#     cd <dir> && git sparse-checkout set .github/skills && git checkout
#
# ~3 MB, no untracked files, shared object store, pinned to the base branch —
# which is the right context for reviewing a diff. The tree is ambient: it is
# NOT checked out at the PR's head.
#
# With WorkDir set, the prompt is a one-liner naming the skill, and the spelling
# is harness-specific: "/golang-pr-review" for copilot (its skill mechanism), or
# "Read and follow .github/skills/golang-pr-review/SKILL.md" for claude (a plain
# file read). PromptFile is NOT re-based — it still resolves against tm3k's own
# working directory. Anchoring is optional: the bash sibling below stays
# unanchored and keeps its PromptFile, which is exactly how both worked before
# WorkDir existed — examples/go-review-prompt.md is the unanchored Go prompt
# this entry used to name, if you would rather not anchor at all. Whichever you
# use, the posted review is required to open by
# naming the profile it applied — a review that names none loaded no skill, and
# that is the only signal tm3k can give you.
Notifiers:
    - Name: go review assist
      Harness: claude
      Prompt: Read and follow .github/skills/golang-pr-review/SKILL.md
      WorkDir: /absolute/path/to/your/skills-worktree
      Point: queue_entered
      Paths:
        - "*.go"
        - go.mod
      Timeout: 10m
      Enabled: false

    - Name: bash review assist
      Harness: claude
      PromptFile: .config/bash-review-prompt.md
      Point: queue_entered
      Paths:
        - "*.sh"
        - "*.bash"
      Timeout: 10m
      Enabled: false
